<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101722">
<title>Industrie — vue 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc6e8;font-family:-apple-system,"Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{background:#101722d9;color:#fff;border:1px solid #ffffff22;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.money{color:#f6c445}
#info{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:#101722e6;color:#e8ecf3;border:1px solid #ffffff22;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#info b{font-size:16px}
#help{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;font-size:12px;background:#0006;padding:5px 12px;border-radius:12px;white-space:nowrap}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<div class="hud"><a class="pill" href="./">← Retour au jeu</a><span class="pill money" id="money"></span></div>
<div id="info"></div>
<div id="help">Glissez pour tourner · pincez pour zoomer · touchez un bâtiment</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './lib/OrbitControls.js';

/* ---------- Lecture de la partie (même sauvegarde que le jeu) ---------- */
let S={money:0,mine:{},fact:{},job:{}};
try{const o=JSON.parse(localStorage.getItem('industrie_save'));if(o&&o.data)S=o.data}catch(e){}
if(location.hash==='#demo'){const now=Date.now();S={money:123456,mine:{bois:12,pierre:8,sable:6,charbon:10,fer:7,cuivre:4,or:2},
 fact:{scierie:3,briqueterie:2,verrerie:2,fonderie:4,fondcu:1,forge:2,acierie:1,menuiserie:1},
 job:{scierie:{q:50,end:now+3e6,rep:true},fonderie:{q:20,end:now+9e5},forge:{q:5,end:now+4e5},verrerie:{q:30,end:now+2e6}}}}
const MINES=[['bois','Bûcheron','🪓',0x6b8e3a],['pierre','Carrière','⛰️',0x9a9a9a],['sable','Sablière','🏜️',0xe2c68a],['charbon','Mine de charbon','⛏️',0x2b2b2b],['fer','Mine de fer','🏔️',0x9c5a3c],['cuivre','Mine de cuivre','🌋',0xc87533],['or',"Mine d'or",'💰',0xf2c230]];
const FACT=[['scierie','Scierie','🪚',0xb07a45],['briqueterie','Briqueterie','🧱',0xb5533c],['verrerie','Verrerie','🔥',0x7fb7c9],['fonderie','Fonderie de fer','🏭',0x6d7480],
 ['fondcu','Fonderie de cuivre','🏭',0xc0773f],['forge','Forge','🔨',0x5b5f66],['acierie','Aciérie','🌡️',0x4f6273],['menuiserie','Menuiserie','🪑',0xc29a6b],
 ['cablerie','Câblerie','🔌',0xd0843a],['orfevrerie','Orfèvrerie','💎',0x9b7ad1],['electro','Usine électronique','🖥️',0x3e8fb0],['chantier','Chantier','🏗️',0xe0b040]];
const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
document.getElementById('money').textContent='💰 '+fmt(S.money||0)+' €';

/* ---------- Scène ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc6e8);scene.fog=new THREE.Fog(0x9cc6e8,70,140);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,300);cam.position.set(34,30,38).multiplyScalar(Math.max(1,1.25/(innerWidth/innerHeight)));
const ctl=new OrbitControls(cam,renderer.domElement);ctl.target.set(0,0,0);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*.46;ctl.minDistance=12;ctl.maxDistance=90;ctl.autoRotate=true;ctl.autoRotateSpeed=.4;
ctl.addEventListener('start',()=>{ctl.autoRotate=false;document.getElementById('help').style.display='none'});

scene.add(new THREE.HemisphereLight(0xdfefff,0x5a7a3a,1.1));
const sun=new THREE.DirectionalLight(0xfff1d6,2.2);sun.position.set(30,45,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,far:150});scene.add(sun);

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85,flatShading:true});
function mesh(geo,mat,x,y,z,parent=scene){const m=new THREE.Mesh(geo,typeof mat==='number'?M(mat):mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}

// sol, route, eau
mesh(new THREE.CylinderGeometry(60,62,2,48),0x6fa34a,0,-1,0);
const road=M(0x3b3f45);
const R={x0:-24,x1:24,z0:-17,z1:19};
mesh(new THREE.BoxGeometry(R.x1-R.x0+4,.1,3),road,0,.05,R.z0);mesh(new THREE.BoxGeometry(R.x1-R.x0+4,.1,3),road,0,.05,R.z1);
mesh(new THREE.BoxGeometry(3,.1,R.z1-R.z0),road,R.x0,.05,(R.z0+R.z1)/2);mesh(new THREE.BoxGeometry(3,.1,R.z1-R.z0),road,R.x1,.05,(R.z0+R.z1)/2);
const lake=mesh(new THREE.CylinderGeometry(7,7,.2,24),new THREE.MeshStandardMaterial({color:0x3f8fd0,roughness:.2,metalness:.1}),-38,.05,-30);
// arbres en périphérie
const rnd=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<70;i++){const a=rnd(0,Math.PI*2),r=rnd(32,55),x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.hypot(x+38,z+30)<9)continue;tree(x,z,rnd(.8,1.6))}
function tree(x,z,s,p=scene){mesh(new THREE.CylinderGeometry(.15*s,.2*s,1*s,6),0x6b4a2b,x,.5*s,z,p);mesh(new THREE.ConeGeometry(.9*s,2.2*s,7),0x2f7d3a,x,2*s,z,p)}

/* ---------- Étiquettes (icône + nom) ---------- */
function label(txt,sub,y,parent,dim){
 const c=document.createElement('canvas');c.width=512;c.height=160;const g=c.getContext('2d');
 g.fillStyle=dim?'#101722aa':'#101722dd';g.beginPath();g.roundRect(6,6,500,148,40);g.fill();
 g.font='bold 54px -apple-system,Segoe UI,sans-serif';g.fillStyle=dim?'#9aa4b5':'#fff';g.textAlign='center';g.fillText(txt,256,72);
 g.font='40px -apple-system,Segoe UI,sans-serif';g.fillStyle=dim?'#7b8597':'#f6c445';g.fillText(sub,256,128);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.scale.set(5,1.56,1);sp.position.y=y;sp.renderOrder=10;parent.add(sp);return sp}

/* ---------- Mines (rangée nord) ---------- */
const pick=[],belts=[];
MINES.forEach(([k,n,ic,col],i)=>{
 const lv=(S.mine||{})[k]||0,g=new THREE.Group();g.position.set(-21+i*7,0,-27);scene.add(g);
 if(k==='bois'){for(let t=0;t<5;t++)tree(rnd(-2,2),rnd(-2,1),1.2,g);mesh(new THREE.BoxGeometry(2,1.4,1.6),0x8a5a33,0,.7,1.6,g);mesh(new THREE.ConeGeometry(1.6,1,4),0x5a3a20,0,1.9,1.6,g).rotation.y=Math.PI/4}
 else{const h=1.5+Math.min(lv,40)*.08;const hill=mesh(new THREE.DodecahedronGeometry(2.6,0),col,0,h*.5,-.5,g);hill.scale.set(1,h/2.6,1);
  mesh(new THREE.BoxGeometry(1.2,1.3,.4),0x1a1a1a,0,.65,1.9,g);mesh(new THREE.BoxGeometry(1.6,.25,.6),0x6b4a2b,0,1.35,1.9,g);
  for(let r=0;r<3;r++)mesh(new THREE.DodecahedronGeometry(.35,0),col,rnd(-1.5,1.5),.3,rnd(2.4,3.2),g)}
 if(!lv)g.traverse(o=>{if(o.material){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.35}});
 label(n,lv?'niv. '+lv:'à construire',5.2,g,!lv);
 g.userData={t:n,ic,d:lv?`Niveau ${lv}`:'Pas encore construite'};pick.push(g);
 if(lv){const belt=mesh(new THREE.BoxGeometry(.9,.15,6),0x2a2d33,0,.25,6,g);const boxes=[];
  for(let b=0;b<4;b++)boxes.push(mesh(new THREE.BoxGeometry(.5,.4,.5),col,0,.55,3+b*1.5,g));belts.push({boxes,speed:.6+Math.min(lv,30)*.05})}
});

/* ---------- Usines (grille 4 × 3) ---------- */
const smokes=[],wheels=[];
const smokeGeo=new THREE.SphereGeometry(.5,6,5);
FACT.forEach(([k,n,ic,col],i)=>{
 const lv=(S.fact||{})[k]||0,job=(S.job||{})[k],g=new THREE.Group();
 g.position.set(-15+(i%4)*10,0,-7+Math.floor(i/4)*10);scene.add(g);
 if(!lv){ // chantier : fondations + grue
  mesh(new THREE.BoxGeometry(5,.3,4),0x9a9282,0,.15,0,g);
  const wire=new THREE.MeshBasicMaterial({color:0xf2c230,wireframe:true,transparent:true,opacity:.5});mesh(new THREE.BoxGeometry(5,3,4),wire,0,1.8,0,g);
  mesh(new THREE.BoxGeometry(.3,6,.3),0xe0a020,2.8,3,-2,g);mesh(new THREE.BoxGeometry(4,.3,.3),0xe0a020,1.2,6,-2,g);
 }else{
  const h=2.4+Math.min(lv,10)*.25;
  mesh(new THREE.BoxGeometry(5,h,4),col,0,h/2,0,g);
  const roof=mesh(new THREE.CylinderGeometry(0,3.2,1.2,4),0x3c4048,0,h+.6,0,g);roof.rotation.y=Math.PI/4;roof.scale.set(1.12,1,.9);
  mesh(new THREE.BoxGeometry(1.4,1.6,.1),0x3a2a1a,0,.8,2.01,g);
  for(const x of[-1.7,1.7])mesh(new THREE.BoxGeometry(.9,.7,.1),new THREE.MeshStandardMaterial({color:job?0xffd27a:0x8fb8d8,emissive:job?0xffa030:0,emissiveIntensity:job?.6:0}),x,h*.6,2.01,g);
  const ch=mesh(new THREE.CylinderGeometry(.35,.45,3,10),0x7a3b2e,1.6,h+1.2,-1.2,g);
  for(let r=0;r<3;r++)mesh(new THREE.TorusGeometry(.42,.06,6,12),0xdddddd,1.6,h+.5+r*.9,-1.2,g).rotation.x=Math.PI/2;
  if(job){for(let s=0;s<6;s++){const p=mesh(smokeGeo,new THREE.MeshStandardMaterial({color:0xeeeeee,transparent:true,opacity:.6}),1.6,0,-1.2,g);p.castShadow=false;p.userData={base:h+2.8,ph:s/6};smokes.push(p)}
   const w=mesh(new THREE.TorusGeometry(.8,.15,6,10),0x999999,-2.6,h-.4,0,g);w.rotation.y=Math.PI/2;wheels.push(w)}
 }
 const sub=!lv?'à construire':job?`⚙️ ${job.q} en cours`:'niv. '+lv;
 label(n,sub,lv?5.6+Math.min(lv,10)*.25:7,g,!lv);
 let d=!lv?'Pas encore construite':`Niveau ${lv}`;
 if(job){const rest=Math.max(0,(job.end-Date.now())/1000);d+=` · ${job.q} unités en cours · reste ${rest>3600?Math.floor(rest/3600)+' h '+Math.floor(rest%3600/60)+' min':Math.ceil(rest/60)+' min'}${job.rep?' · 🔁':''}`}
 else if(lv)d+=' · à l\'arrêt';
 g.userData={t:n,ic,d};pick.push(g);
});

/* ---------- Camions qui font le tour ---------- */
const trucks=[];
const path=[[R.x0,R.z0],[R.x1,R.z0],[R.x1,R.z1],[R.x0,R.z1]];const per=2*((R.x1-R.x0)+(R.z1-R.z0));
const nT=Math.max(2,Math.min(8,Object.keys(S.fact||{}).length+1));
for(let i=0;i<nT;i++){const g=new THREE.Group();scene.add(g);
 mesh(new THREE.BoxGeometry(2.4,1.3,1.2),[0xd94a3a,0x3a7bd9,0xe0b040,0x3aa66a][i%4],-.3,1,0,g);
 mesh(new THREE.BoxGeometry(.9,1,1.1),0xeeeeee,1.2,.85,0,g);
 for(const x of[-1,1])for(const z of[-.6,.6])mesh(new THREE.CylinderGeometry(.3,.3,.2,10),0x111111,x,.3,z,g).rotation.x=Math.PI/2;
 trucks.push({g,d:i*per/nT})}
function along(d){d=((d%per)+per)%per;for(let i=0;i<4;i++){const[a,b]=[path[i],path[(i+1)%4]],L=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);
 if(d<=L){const t=d/L;return{x:a[0]+(b[0]-a[0])*t+(i==1?-.8:i==3?.8:0),z:a[1]+(b[1]-a[1])*t+(i==0?.8:i==2?-.8:0),a:Math.atan2(-(b[1]-a[1]),b[0]-a[0])}}d-=L}return{x:0,z:0,a:0}}

/* ---------- Toucher un bâtiment ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),info=document.getElementById('info');let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;
 ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,cam);
 const hit=ray.intersectObjects(pick,true).find(h=>!h.object.isSprite);
 if(!hit){info.style.display='none';return}
 let o=hit.object;while(o&&!o.userData.t)o=o.parent;
 info.innerHTML=`<b>${o.userData.ic} ${o.userData.t}</b><br>${o.userData.d}`;info.style.display='block';
 ctl.target.lerp(o.position,.6)});

/* ---------- Animation ---------- */
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);
 for(const p of smokes){const k=(t*.35+p.userData.ph)%1;p.position.y=p.userData.base+k*5;p.position.x=1.6+k*1.5;p.scale.setScalar(.4+k*1.6);p.material.opacity=.6*(1-k)}
 for(const w of wheels)w.rotation.x=t*2;
 for(const b of belts)b.boxes.forEach((m,i)=>{m.position.z=3+((t*b.speed+i*1.5)%6)});
 for(const tr of trucks){const p=along(tr.d+t*4);tr.g.position.set(p.x,0,p.z);tr.g.rotation.y=p.a}
 lake.material.color.setHSL(.57,.55,.5+Math.sin(t)*.03);
 ctl.update();renderer.render(scene,cam)});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
